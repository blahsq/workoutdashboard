<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workouts — pakiet treningów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Workouts</h1>
        <p class="sub" id="sub">—</p>
      </div>
      <div class="pill" id="packagePill">Pakiet 10</div>
    </header>

    <section class="grid">
      <article class="card card--ring">
        <div class="ring" id="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
          </svg>
          <span class="ring-value" id="remaining">0</span>
        </div>
        <h2>Pozostałe treningi</h2>
        <p class="muted" id="remainingSub">—</p>
      </article>

      <article class="card card--stat">
        <div class="stat"><span class="stat-value" id="usedValue">0</span><span class="stat-unit" id="usedUnit">/ 10</span></div>
        <h2>Wykorzystane</h2>
        <p class="muted" id="usedSub">—</p>
      </article>

      <article class="card card--progress">
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="bar-meta">
          <div><span class="stat-value small" id="percentValue">0%</span><h2>Postęp pakietu</h2></div>
          <p class="muted" id="lastSession">—</p>
        </div>
      </article>

      <article class="card card--slots">
        <div class="slots-head">
          <h2>Treningi w pakiecie</h2>
          <p class="muted">Odbyte zaznaczone na jasno</p>
        </div>
        <ul class="slots" id="slots"></ul>
      </article>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
